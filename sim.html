<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        body {
            background-image: url(hello.jpeg);
            margin: 0;
            min-height: 100vh; /* Ocupa a altura total da tela */
            display: flex;
            justify-content: center; /* Centraliza na horizontal */
            align-items: center;     /* Centraliza na vertical */
        }

        h2 {
            margin-top: 0;           /* Sobe o cabeçalho tirando a margem superior padrão */
            margin-bottom: 20px;
            padding: 0;
            text-align: center;
        }

        #card {
            font-family: 'Brush Script MT', cursive;
            width: 400px; 
            height: 200px;
            max-height: 80%;
            max-width: 90%;          /* Garante responsividade em telas menores */
            padding: 25px 30px;      /* Define o tamanho interno em vez de usar altura fixa */
            background-color: white;
            border-radius: 25px;
            border: 5px solid #d8829d3f; /* Borda rosa combinando com a Hello Kitty */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); /* Sombra leve para dar destaque */
        }

        ul {
            margin-top: 60px;
            padding-left: 20px;       /* Alinha a lista de forma agradável dentro do card */
        }
    </style>
</head>

<body>
    <div id="card">
        <h2>Requisitos</h2>
        <ul>
            <li>Presença (obrigatório)</li>
            <li>Um beijo (opcional, a depender da vontade da moça)</li>
        </ul>
    </div>
</body>
</html>
